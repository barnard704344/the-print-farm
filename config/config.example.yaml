# ============================================================
# Print Farm — Configuration
# ============================================================
# Copy this file to config.yaml and edit to match your setup.
#
# Supports both BambuLab and Klipper printers.
# Printers can also be added from the dashboard Settings tab.
# ============================================================

printers: []
# ── BambuLab Printer ──
#  - name: P1S-1
#    type: bambulab             # optional — defaults to bambulab
#    host: 192.168.1.100
#    access_code: '12345678'
#    serial: 01P00C000000000
#    mqtt_port: 8883
#    ftp_port: 990
#    camera_port: 6000
#    tls_fingerprints:           # optional explicit SHA-256 pins; otherwise TOFU is used
#      mqtt: ''
#      ftp: ''
#      camera: ''
#    staff_only: false          # optional — restrict to staff users
#    virtual_printer: true      # native only; set false for Docker/direct-IP use
#
# ── Klipper Printer (via Moonraker) ──
#  - name: Voron-01
#    type: klipper
#    host: 192.168.1.200
#    moonraker_port: 7125       # default Moonraker port
#    api_key: ''                # optional — Moonraker API key
#    camera_url: ''             # optional — webcam stream URL
#    staff_only: false

web:
  host: 127.0.0.1            # Apache is the public-facing reverse proxy
  port: 5000
  orca_api_key: CHANGE_ME       # upload-only key shared with OrcaSlicer users
  admin_api_key: CHANGE_ME      # hidden server/integration key; never share with users
  admin_password: ''            # legacy single-password mode (ignored when local_users set)
  max_upload_mb: 1024
  session_cookie_secure: false   # set true after enabling HTTPS on Apache

queue:
  upload_dir: ./uploads
  db_path: ./data/farm.db
  auto_assign: false

# ── Local Users ──────────────────────────────────────────
# Works with or without Active Directory.
# When AD is also enabled, local users are checked first.
local_users: []
#  - username: admin
#    password_hash: scrypt:...   # generate with werkzeug.security.generate_password_hash
#    role: staff                 # staff = admin access
#    display_name: Administrator
#  - username: student1
#    password_hash: scrypt:...
#    role: student

# ── Student Print Access ─────────────────────────────────
# Staff can always print. Students must be on the allowlist and not on the
# banlist before they can upload, send, or reprint jobs. Match by username
# or display name; these lists can also be managed from Settings.
student_access:
  allowlist: []
  banlist: []

# ── Active Directory (optional) ──────────────────────────
# Set enabled: true only if you have an AD/LDAP server.
active_directory:
  enabled: false
#  server: 10.0.0.1
#  port: 636
#  use_ssl: true
#  tls_validate: true
#  ca_certs_file: /etc/ssl/certs/ca-certificates.crt
#  base_dn: DC=example,DC=local
#  bind_user: CN=svc_account,OU=Service,DC=example,DC=local
#  bind_password: CHANGE_ME
#  student_ou: OU=Students,DC=example,DC=local
#  staff_ou: OU=Staff,DC=example,DC=local

# ── Spoolman (optional) ──────────────────────────────────
# Set the URL of your Spoolman instance for filament tracking.
# Leave commented out to disable. Can also be set from the dashboard; restart
# after changing it so the optional client and UI state are rebuilt.
#spoolman:
#  url: http://localhost:7912

# ── Display and printer readiness ────────────────────────
ui:
  timezone: ''
  locale: en-AU
  # A connected FAILED printer becomes READY after this delay.
  # Jobs are never resent automatically. Set to 0 to disable.
  failed_printer_timeout_minutes: 5

logging:
  level: INFO
